<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img"
     aria-label="UCM-Bridge architecture: six platform connectors extract into one canonical UC model and apply back out, in both directions, behind a row of enforced guardrails.">
  <title>UCM-Bridge — hub-and-spoke connector architecture</title>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#0a0c1a"/>
  <circle cx="400" cy="270" r="240" fill="url(#glow)"/>

  <!-- Column headings -->
  <text x="118" y="52" fill="#8a8fa8" font-family="'Space Grotesk',sans-serif"
        font-size="15" font-weight="600" letter-spacing="1.6" text-anchor="middle">ON-PREM</text>
  <text x="682" y="52" fill="#8a8fa8" font-family="'Space Grotesk',sans-serif"
        font-size="15" font-weight="600" letter-spacing="1.6" text-anchor="middle">CLOUD</text>

  <!-- On-prem connectors -->
  <g font-family="Inter,sans-serif">
    <g>
      <rect x="24" y="80" width="188" height="62" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.11)"/>
      <text x="44" y="107" fill="#ffffff" font-size="17" font-weight="600">Cisco CUCM</text>
      <text x="44" y="128" fill="#8a8fa8" font-size="13.5">AXL · SOAP</text>
    </g>
    <g>
      <rect x="24" y="158" width="188" height="62" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.11)"/>
      <text x="44" y="185" fill="#ffffff" font-size="17" font-weight="600">Avaya Aura</text>
      <text x="44" y="206" fill="#8a8fa8" font-size="13.5">SAT · terminal forms</text>
    </g>
    <g>
      <rect x="24" y="236" width="188" height="62" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.11)"/>
      <text x="44" y="263" fill="#ffffff" font-size="17" font-weight="600">Skype for Business</text>
      <text x="44" y="284" fill="#8a8fa8" font-size="13.5">Remote PowerShell</text>
    </g>
  </g>

  <!-- Cloud connectors -->
  <g font-family="Inter,sans-serif">
    <g>
      <rect x="588" y="80" width="188" height="62" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.11)"/>
      <text x="608" y="107" fill="#ffffff" font-size="17" font-weight="600">Teams Phone</text>
      <text x="608" y="128" fill="#8a8fa8" font-size="13.5">Graph · Teams cmdlets</text>
    </g>
    <g>
      <rect x="588" y="158" width="188" height="62" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.11)"/>
      <text x="608" y="185" fill="#ffffff" font-size="17" font-weight="600">Slack</text>
      <text x="608" y="206" fill="#8a8fa8" font-size="13.5">Web API</text>
    </g>
    <g>
      <rect x="588" y="236" width="188" height="62" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.11)"/>
      <text x="608" y="263" fill="#ffffff" font-size="17" font-weight="600">Genesys Cloud CX</text>
      <text x="608" y="284" fill="#8a8fa8" font-size="13.5">Platform API</text>
    </g>
  </g>

  <!-- The hub -->
  <rect x="262" y="126" width="276" height="126" rx="18" fill="rgba(255,255,255,0.07)" stroke="url(#grad)" stroke-width="1.6"/>
  <text x="400" y="166" fill="#ffffff" font-family="'Space Grotesk',sans-serif" font-size="21"
        font-weight="700" text-anchor="middle">Canonical UC Model</text>
  <text x="400" y="194" fill="#8a8fa8" font-family="Inter,sans-serif" font-size="14"
        text-anchor="middle">74 entity kinds · 10 domains</text>
  <text x="400" y="216" fill="#8a8fa8" font-family="Inter,sans-serif" font-size="14"
        text-anchor="middle">vendor-neutral · versioned</text>
  <text x="400" y="238" fill="#22d3ee" font-family="Inter,sans-serif" font-size="13.5"
        text-anchor="middle">every object carries its fidelity</text>

  <!-- Extract arrows in, apply arrows out. Bidirectional is the whole point. -->
  <g stroke-width="1.8" fill="none">
    <path d="M212,111 C240,111 236,150 260,158" stroke="#22d3ee" marker-end="url(#arrowR)"/>
    <path d="M212,189 L258,189" stroke="#22d3ee" marker-end="url(#arrowR)"/>
    <path d="M212,267 C240,267 236,228 260,220" stroke="#22d3ee" marker-end="url(#arrowR)"/>

    <path d="M540,158 C564,150 560,111 586,111" stroke="#8b5cf6" marker-end="url(#arrowV)"/>
    <path d="M542,189 L586,189" stroke="#8b5cf6" marker-end="url(#arrowV)"/>
    <path d="M540,220 C564,228 560,267 586,267" stroke="#8b5cf6" marker-end="url(#arrowV)"/>
  </g>

  <text x="236" y="330" fill="#22d3ee" font-family="Inter,sans-serif" font-size="13.5"
        font-weight="600" text-anchor="middle">Extract — read-only, always</text>
  <text x="566" y="330" fill="#8b5cf6" font-family="Inter,sans-serif" font-size="13.5"
        font-weight="600" text-anchor="middle">Apply — dry run by default</text>

  <!-- Reverse direction, stated rather than implied -->
  <g>
    <path d="M600,352 L200,352" stroke="#8b5cf6" stroke-width="1.6" fill="none"
          marker-end="url(#arrowR)" stroke-dasharray="6 5" opacity="0.85"/>
    <rect x="286" y="336" width="228" height="30" rx="15" fill="#0a0c1a"/>
    <text x="400" y="356" fill="#d7dae6" font-family="Inter,sans-serif" font-size="13.5"
          text-anchor="middle">same pipeline, ends swapped</text>
  </g>

  <!-- Guardrails -->
  <rect x="24" y="398" width="752" height="176" rx="16" fill="rgba(255,255,255,0.035)"
        stroke="rgba(255,255,255,0.09)"/>
  <text x="44" y="428" fill="#8a8fa8" font-family="'Space Grotesk',sans-serif" font-size="14"
        font-weight="600" letter-spacing="1.4">ENFORCED IN CODE, NOT BY CONVENTION</text>

  <g font-family="Inter,sans-serif" font-size="13.5" fill="#d7dae6">
    <text x="44" y="460">✓ Zero writes to any source, in any mode</text>
    <text x="44" y="486">✓ Dry run is mandatory and matched by plan digest</text>
    <text x="44" y="512">✓ Two-person approval; approver ≠ operator</text>
    <text x="44" y="538">✓ Emergency calling confirmed per site</text>

    <text x="416" y="460">✓ Unverified connectors cannot write to production</text>
    <text x="416" y="486">✓ Nothing is LOSSLESS without evidence</text>
    <text x="416" y="512">✓ Hash-chained audit; tampering is detectable</text>
    <text x="416" y="538">✓ A wave that splits a shared line is rejected</text>
  </g>
</svg>
